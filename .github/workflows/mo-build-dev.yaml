name: Build, Package, Release (mo-build-dev.yaml)
description: Build and release a Docker image for AMD64 architecture without semantic release.
'on':
  release:
    types:
      - created
  push:
    branches:
      - dev
env:
  VERSION: 0.0.1
  MO_DOCKERFILE: Dockerfile
  MO_DOCKERCONTEXT: .
  MO_REGISTRY_AUTH_URL: https://ghcr.io
  MO_REGISTRY_URL: ghcr.io/janlepsky
  MO_IMAGE_NAME: off-gw
  MO_API_KIND: workspace
  MO_API_TOKEN_EXPIRES_AT__751644F8227CF84F4CFA: '2299-07-05T10:15:39.000Z'
  MO_SERVICE__751644F8227CF84F4CFA: H4sIAAAAAAAAA13MwW6EIBSF4Xc5a0hFQdR1N930Ha54OyGjQACnaSfz7o22mUW3/7n3uyPmCwX/TdXH8LZgwoftWtdrkp3VvdRLy3KeZyf10IxktOLFOgi4dS+V8/nSLLOxhnrZdoOR2gwkyVgn1aDM3Gs1qn6EwGfM15LI8TttjAmVaWsUBDKXuGfHmO64+nCQr5zW+LVxqBAIv/fLs5W/eGqYAIFLjnvCBEqpvNwO9ca5+BiO+fE0kk+8+sCVS/2HHNOZHz/MJxbcFgEAAA==
jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: get semversion
        run: |
          VERSION=$(git describe --tags $(git rev-list --tags --max-count=1))
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Get last commit hash
        id: lastHash
        run: |
          LAST_HASH=$(git rev-parse --short HEAD)
          echo "LAST_HASH=$LAST_HASH" >> $GITHUB_ENV
      - id: containerRegistryLogin
        name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.MO_REGISTRY_AUTH_URL }}
          username: ${{ secrets.MO_REGISTRY_USER__MO_BUILD_DEV }}
          password: ${{ secrets.MO_REGISTRY_PAT__MO_BUILD_DEV }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push amd64 image
        id: buildAndPushImage
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.MO_DOCKERCONTEXT }}
          file: ${{ env.MO_DOCKERFILE }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.MO_REGISTRY_URL }}/${{ env.MO_IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.MO_REGISTRY_URL }}/${{ env.MO_IMAGE_NAME }}:latest
            ${{ env.MO_REGISTRY_URL }}/${{ env.MO_IMAGE_NAME }}:${{ env.LAST_HASH }}
          build-args: VERSION=${{ env.VERSION }}
      - id: releaseWithMogenius-751644F8227CF84F4CFA
        name: Release with mogenius
        uses: mogenius/mogenius-release-action@v1
        with:
          dev: false
          image: ${{ env.MO_REGISTRY_URL }}/${{ env.MO_IMAGE_NAME }}:${{ env.VERSION }}
          kind: Deployment
          namespace: pipetest
          resourceName: pipelinetest
          containerName: nginx
          keyKind: ${{ env.MO_API_KIND }}
          token: bearer ${{ secrets.MO_API_TOKEN__751644F8227CF84F4CFA__MO_BUILD_DEV }}
