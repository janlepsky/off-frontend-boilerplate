name: Build Preview Image

on:
  pull_request:
    types: [opened, reopened, labeled, synchronize]

env:
  MO_DOCKERFILE: Dockerfile
  MO_DOCKERCONTEXT: .
  MO_REGISTRY_AUTH_URL: https://ghcr.io
  MO_REGISTRY_URL: ghcr.io/janlepsky
  MO_IMAGE_NAME: ${{ github.event.repository.name }}
  # Base domain of the preview-environments blueprint. The preview host is
  # <repo>-pr-<n>.<PREVIEW_DOMAIN>.
  PREVIEW_DOMAIN: demo.janlepsky.com

jobs:
  build-preview:
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Get short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-8)" >> $GITHUB_ENV

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.MO_REGISTRY_AUTH_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push preview image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.MO_DOCKERCONTEXT }}
          file: ${{ env.MO_DOCKERFILE }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.MO_REGISTRY_URL }}/${{ env.MO_IMAGE_NAME }}:${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://${context.repo.repo}-pr-${context.issue.number}.${process.env.PREVIEW_DOMAIN}`;
            const marker = '<!-- preview-env-url -->';
            const body = [
              marker,
              `### 🚀 Preview environment`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **URL** | ${url} |`,
              `| **Image** | \`${process.env.MO_REGISTRY_URL}/${process.env.MO_IMAGE_NAME}:${process.env.SHORT_SHA}\` |`,
              ``,
              `_Deployed per PR via the mogenius ArgoCD \`preview-environments\` blueprint. Updates on every push; torn down when this PR is closed._`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Summary
        run: |
          echo "### Preview Image Built" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ env.MO_REGISTRY_URL }}/${{ env.MO_IMAGE_NAME }}:${{ env.SHORT_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "URL: https://${{ env.MO_IMAGE_NAME }}-pr-${{ github.event.pull_request.number }}.${{ env.PREVIEW_DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo "PR: #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
