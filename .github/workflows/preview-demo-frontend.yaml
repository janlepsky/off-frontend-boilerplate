name: Build, Package, Release (preview-demo-frontend.yaml)
description: Build and release a Docker image for AMD64 architecture without semantic release.
'on':
  release:
    types:
      - created
  push:
    branches:
      - dev
env:
  VERSION: 0.0.1
  MO_DOCKERFILE: Dockerfile
  MO_DOCKERCONTEXT: .
  MO_REGISTRY_AUTH_URL: https://ghcr.io
  MO_REGISTRY_URL: ghcr.io/janlepsky
  MO_IMAGE_NAME: preview-demo-frontend
  MO_API_KIND: workspace
  MO_API_TOKEN_EXPIRES_AT__81425723A39157049C61: '2026-09-27T18:28:29.000Z'
  MO_SERVICE__81425723A39157049C61: H4sIAAAAAAAAA12NMW/DIBSE/8vNRjU2rglzly4duz/Mo0KxAQFO1Eb575VTqaq63PDpvrsbUvmgGL6ohRRfHQzUqGciO4lh9JNQeh6EPj1PwmvrnZVS8cDosKx7bVweCkurXK+9UNMR6sTCKmfFQjTMYy/VPGl0uKZyrpkWfqONYdCYtl6iQ+Ga9rIwzA3nEI/JF85r+tw4NnTI615ohYH7pRUdKId3LjWkCAPKuT5djrVIGz9uHEwrO99/EAxy4Uvgq3C8JeFLio2j+2v86+D+DcDXWMcgAQAA
jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: get semversion
        run: |
          VERSION=$(git describe --tags $(git rev-list --tags --max-count=1))
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Get last commit hash
        id: lastHash
        run: |
          LAST_HASH=$(git rev-parse --short HEAD)
          echo "LAST_HASH=$LAST_HASH" >> $GITHUB_ENV
      - id: containerRegistryLogin
        name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.MO_REGISTRY_AUTH_URL }}
          username: ${{ secrets.MO_REGISTRY_USER__PREVIEW_DEMO_FRONTEND }}
          password: ${{ secrets.MO_REGISTRY_PAT__PREVIEW_DEMO_FRONTEND }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push amd64 image
        id: buildAndPushImage
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.MO_DOCKERCONTEXT }}
          file: ${{ env.MO_DOCKERFILE }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.MO_REGISTRY_URL }}/${{ env.MO_IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.MO_REGISTRY_URL }}/${{ env.MO_IMAGE_NAME }}:latest
            ${{ env.MO_REGISTRY_URL }}/${{ env.MO_IMAGE_NAME }}:${{ env.LAST_HASH }}
          build-args: VERSION=${{ env.VERSION }}
      - id: releaseWithMogenius-81425723A39157049C61
        name: Release with mogenius
        uses: mogenius/mogenius-release-action@v1
        with:
          dev: true
          image: ${{ env.MO_REGISTRY_URL }}/${{ env.MO_IMAGE_NAME }}:${{ env.VERSION }}
          kind: Deployment
          namespace: preview-demo
          resourceName: preview-demo-frontend
          containerName: preview-demo-frontend
          keyKind: ${{ env.MO_API_KIND }}
          token: bearer ${{ secrets.MO_API_TOKEN__81425723A39157049C61__PREVIEW_DEMO_FRONTEND }}
